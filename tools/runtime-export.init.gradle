import org.gradle.jvm.toolchain.JavaLauncher

gradle.projectsEvaluated {
    rootProject.allprojects {
        def runtimeProject = project
        def fabric = plugins.hasPlugin('net.fabricmc.fabric-loom-remap')
        def forge = plugins.hasPlugin('net.minecraftforge.gradle')
        def shared = fabric ? projectDir : file('../..')
        def loader = fabric ? 'fabric' : (forge ? 'forge' : 'neoforge')
        tasks.withType(JavaExec).matching { it.name in (forge ? ['runClient', 'runServer'] : ['runRuntimeClient', 'runRuntimeServer']) }.configureEach { task ->
            def server = task.name.toLowerCase().endsWith('server')
            def launcher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }.get()
            if (!server) {
                def gui = layout.file(providers.provider { new File(launcher.executablePath.asFile.parentFile, 'javaw.exe') }).get()
                javaLauncher.set([getMetadata: { launcher.metadata }, getExecutablePath: { gui }] as JavaLauncher)
                maxHeapSize = '1280m'
            } else {
                javaLauncher.set(launcher); maxHeapSize = '1024m'
            }
            def role = server ? 'server' : runtimeProject.providers.gradleProperty('runtimeRole').getOrElse('Luis')
            def capture = new File(shared, '.verification/runtime-capture.jar')
            def output = new File(shared, ".verification/runtime/${loader}/commands/${role}.json")
            jvmArgs "-javaagent:${capture.absolutePath}", "-Dchaoschatplus.exportPath=${output.absolutePath}"
        }
    }
}
