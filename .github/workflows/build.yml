name: Build and test all loaders
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, forge, neoforge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Fabric
        if: matrix.loader == 'fabric'
        run: bash gradlew build --no-daemon
      - name: Build Forge or NeoForge
        if: matrix.loader != 'fabric'
        run: bash gradlew -p platforms/${{ matrix.loader }} build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: chaoschatplus-${{ matrix.loader }}
          path: |
            build/libs/*.jar
            platforms/*/build/libs/*.jar
