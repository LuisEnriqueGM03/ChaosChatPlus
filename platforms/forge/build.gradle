plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '7.0.29'
    id 'net.minecraftforge.jarjar' version '0.2.3'
}
minecraft {
    runs {
        configureEach { workingDir = layout.projectDirectory.dir('run'); args '--mixin.config=chaoschatplus.mixins.json' }
        register('client')
        register('server') { args '--nogui' }
    }
}
repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}
dependencies { implementation minecraft.dependency('net.minecraftforge:forge:26.3-66.0.13') }

version = '1.1.1'
group = 'com.chaos'
base { archivesName = 'chaoschatplus-forge-26.3' }
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
sourceSets {
    main {
        java.setSrcDirs(['../../src/main/java', '../../src/client/java', 'src/main/java'])
        resources.setSrcDirs(['../../src/main/resources', 'src/main/resources'])
        resources.exclude 'fabric.mod.json'
    }
    test { java.srcDir '../../src/test/java' }
}
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/*.toml') { expand version: project.version }
}
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }
jar { manifest.attributes('MixinConfigs': 'chaoschatplus.mixins.json') }

jarJar.register()
tasks.named('jar') { archiveClassifier = 'slim' }
tasks.named('jarJar') { archiveClassifier = null }
dependencies {
    compileOnly 'io.github.llamalad7:mixinextras-common:0.5.0'
    implementation 'io.github.llamalad7:mixinextras-forge:0.5.0'
    jarJar 'io.github.llamalad7:mixinextras-forge:0.5.0'
}

apply from: '../../tools/runtime-runs.gradle'

// Forge bundles Mixin 0.8.7; bytecode and runtime still require Java 25.
processResources { filesMatching('chaoschatplus.mixins.json') { filter { it.replace('JAVA_25', 'JAVA_21') } } }
