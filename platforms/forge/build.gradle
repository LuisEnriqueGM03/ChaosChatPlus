plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '7.0.29'
    id 'net.minecraftforge.jarjar' version '0.2.3'
}
minecraft {
    mappings channel: 'official', version: '1.21.1'
    runs {
        configureEach { workingDir = layout.projectDirectory.dir('run'); args '--mixin.config=chaoschatplus.mixins.json' }
        register('client')
        register('server') { args '--nogui' }
    }
}
repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}
dependencies { implementation minecraft.dependency('net.minecraftforge:forge:1.21.1-52.1.20') }

version = '1.1.0'
group = 'com.chaos'
base { archivesName = 'chaoschatplus-forge-1.21.1' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
sourceSets {
    main {
        java.setSrcDirs(['../../src/main/java', '../../src/client/java', 'src/main/java'])
        resources.setSrcDirs(['../../src/main/resources', 'src/main/resources'])
        resources.exclude 'fabric.mod.json'
    }
    test { java.srcDir '../../src/test/java' }
}
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
processResources { filesMatching('META-INF/*.toml') { expand version: project.version } }
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }
jar { manifest.attributes('MixinConfigs': 'chaoschatplus.mixins.json') }

jarJar.register()
tasks.named('jar') { archiveClassifier = 'slim' }
tasks.named('jarJar') { archiveClassifier = null }
dependencies {
    compileOnly 'io.github.llamalad7:mixinextras-common:0.5.0'
    implementation 'io.github.llamalad7:mixinextras-forge:0.5.0'
    jarJar 'io.github.llamalad7:mixinextras-forge:0.5.0'
}
