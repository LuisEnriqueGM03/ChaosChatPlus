plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

loom {
	splitEnvironmentSourceSets()
	mods {
		"chaoschatplus" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		// Servidor de pruebas en su propia carpeta: ./gradlew runServer
		server {
			runDir "run-server"
		}
		// Cliente que entra directo al servidor local como "Luis": ./gradlew runJoinServer
		joinServer {
			client()
			name "Join Server"
			programArgs "--username", "Luis", "--quickPlayMultiplayer", "localhost:25565"
			vmArg "-Dchaoschatplus.selftest=" + (project.findProperty("selftest") ?: "false")
			vmArg "-Dchaoschatplus.record=" + (project.findProperty("record") ?: "false")
		}
		// Segundo jugador ("Pepe") con el mod: ./gradlew runJoinServer2
		joinServer2 {
			client()
			name "Join Server (Pepe)"
			runDir "run2"
			programArgs "--username", "Pepe", "--quickPlayMultiplayer", "localhost:25565"
			vmArg "-Dchaoschatplus.selftest=" + (project.findProperty("selftest") ?: "false")
			vmArg "-Dchaoschatplus.record=" + (project.findProperty("record") ?: "false")
		}
		// Segundo jugador ("Pepe"), que se porta como un cliente sin el mod: ./gradlew runJoinVanilla
		joinVanilla {
			client()
			name "Join Server (vanilla)"
			runDir "run2"
			programArgs "--username", "Pepe", "--quickPlayMultiplayer", "localhost:25565"
			vmArg "-Dchaoschatplus.forceVanilla=true"
			vmArg "-Dchaoschatplus.selftest=" + (project.findProperty("selftest") ?: "false")
			vmArg "-Dchaoschatplus.record=" + (project.findProperty("record") ?: "false")
		}
	}
}

repositories { mavenCentral() }

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

test { useJUnitPlatform() }

sourceSets.main.java.srcDir "src/fabric/java"
sourceSets.client.java.srcDir "src/fabricClient/java"

apply from: 'tools/runtime-runs.gradle'
